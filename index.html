<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
        }

        #cards {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

    <div id="cards"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name");

        const cards = document.getElementById("cards");

        if (!name) {
            document.body.innerHTML =
                "<p style='color:white;text-align:center;'>ページが見つかりません</p>";
        } else {

            let number = 1;

            function loadImage() {
                const img = new Image();

                img.src = `images/${name}/${number}.png`;

                img.onload = function () {
                    cards.appendChild(img);
                    number++;
                    loadImage();
                };

                img.onerror = function () {
                    console.log("画像読み込み完了");
                };
            }

            loadImage();
        }
    </script>

</body>
</html>
